<!DOCTYPE html>
<html>
<head>
    <title>Adaptive Registration System</title>
    <link rel="stylesheet" href="ex1.css">
</head>
<body>

<h2>User Registration</h2>

<form id="regForm" onsubmit="return validateForm()">

    <label>Name:</label>
    <input type="text" id="name">

    <label>Email:</label>
    <input type="email" id="email" onkeyup="validateEmail()">
    <div id="emailMsg" class="message"></div>

    <label>Password:</label>
    <input type="password" id="password" onkeyup="validatePassword()">
    <div id="passMsg" class="message"></div>

    <label>Confirm Password:</label>
    <input type="password" id="confirmPassword">

    <label>Age:</label>
    <input type="number" id="age">

    <label>Role:</label>
    <select id="role" onchange="roleChange()">
        <option value="">Select</option>
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
        <option value="admin">Admin</option>
    </select>

    <div id="skillsField">
        <label>Skills:</label>
        <input type="text" id="skills">
    </div>

    <br><br>
    <input type="submit" value="Register">

</form>

<script src="ex1.js"></script>
</body>
</html>
